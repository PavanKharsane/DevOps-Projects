apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-dep
  namespace: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  sample-app
  template:
    metadata:
      labels:
        app:  sample-app
    spec:
      containers:
      - name:  sample-app
        image: sample-app:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: CONSUMER_KEY
          valueFrom:
            secretKeyRef:
              name: app-runtime
              key: consumer-key
        - name: CONSUMER_SECRET
          valueFrom:
            secretKeyRef:
              name: app-runtime
              key: consumer-secret
        - name: ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-runtime
              key: access-token
        - name: ACCESS_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: app-runtime
              key: access-token-secret
